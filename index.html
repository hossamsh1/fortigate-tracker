</head>
<body>
<div id="root"></div>
<script>

const DEFAULT_TASKS=[

{id:"s2t4",phase:2,phaseLabel:"Phase 2 — Web Filter Profiles",title:"Create Web Filter Profile: WF_Unrestricted (Management)",desc:"All categories — global block still applied",deadline:"2025-07-15",status:"todo",priority:"medium"},

{id:"s3t2",phase:3,phaseLabel:"Phase 3 — Firewall Policies",title:"Create Rule 2: Mgmt-OUT (Top Management)",desc:"Source: G_Mgmt · Web Filter: WF_Unrestricted · Action: ACCEPT",deadline:"2025-07-21",status:"todo",priority:"high"},
{id:"s3t3",phase:3,phaseLabel:"Phase 3 — Firewall Policies",title:"Create Rule 3: IT-OUT (IT Team)",desc:"Source: G_IT · Web Filter: WF_IT · Action: ACCEPT",deadline:"2025-07-22",status:"todo",priority:"high"},

{id:"s3t5",phase:3,phaseLabel:"Phase 3 — Firewall Policies",title:"Create Rule 5: Tier1-OUT (Levels 0–5)",desc:"Source: G_Tier1 · Web Filter: WF_Strict · Action: ACCEPT",deadline:"2025-07-23",status:"todo",priority:"high"},

{id:"s5t3",phase:5,phaseLabel:"Phase 5 — Testing",title:"Test Tier 2 account — LinkedIn/cloud accessible",desc:"Confirm LinkedIn & OneDrive work for Level 6–8 user",deadline:"2025-08-05",status:"todo",priority:"high"},
{id:"s5t4",phase:5,phaseLabel:"Phase 5 — Testing",title:"Test Management account — full access confirmed",desc:"Streaming and broad browsing allowed · global block still active",deadline:"2025-08-05",status:"todo",priority:"medium"},

{id:"s6t2",phase:6,phaseLabel:"Phase 6 — Go Live",title:"Schedule production deployment change window",desc:"Off-hours rollout · notify helpdesk to expect calls",deadline:"2025-08-12",status:"todo",priority:"high"},
{id:"s6t3",phase:6,phaseLabel:"Phase 6 — Go Live",title:"Take FortiGate config snapshot before go-live",desc:"Backup running config — rollback point if issues arise",deadline:"2025-08-12",status:"todo",priority:"critical"},
{id:"s6t4",phase:6,phaseLabel:"Phase 6 — Go Live",title:"30-day post-deployment log review",desc:"Analyse FortiGate logs · fine-tune categories · document changes",deadline:"2025-09-12",status:"todo",priority:"medium"},
];

const SC={todo:{label:"To do",color:"#5F5E5A",bg:"#F1EFE8",border:"#B4B2A9"},inprogress:{label:"In progress",color:"#185FA5",bg:"#E6F1FB",border:"#85B7EB"},done:{label:"Done",color:"#3B6D11",bg:"#EAF3DE",border:"#97C459"},blocked:{label:"Blocked",color:"#A32D2D",bg:"#FCEBEB",border:"#F09595"}};
const PC={critical:{label:"Critical",color:"#A32D2D",bg:"#FCEBEB"},high:{label:"High",color:"#854F0B",bg:"#FAEEDA"},medium:{label:"Medium",color:"#185FA5",bg:"#E6F1FB"},low:{label:"Low",color:"#3B6D11",bg:"#EAF3DE"}};
const PCOLS=["#185FA5","#0F6E56","#854F0B","#6A3FA0","#A32D2D","#3B6D11"];
const ADMIN_PIN="1234";
const API_URL="https://script.google.com/macros/s/AKfycbzSZmtvATL9wuCENZVfxX86LqjFdaIeRou1LcHoj6IZrXha2BPhIzXHNq3qas-6TLiOHw/exec";

function fmtDate(d){if(!d)return"—";const dt=new Date(d+"T00:00:00");return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}
function isOD(deadline,status){if(!deadline||status==="done")return false;return new Date(deadline+"T00:00:00")<new Date(new Date().toDateString());}

function RoleSelect({onAdmin,onViewer}){
  return h("div",{style:{padding:"2.5rem 1.5rem",maxWidth:380,margin:"0 auto",textAlign:"center"}},
    h("div",{style:{fontSize:13,color:"var(--color-text-secondary,#888)",marginBottom:4,letterSpacing:.5,textTransform:"uppercase",fontWeight:500}},"FortiGate"),
    h("div",{style:{fontSize:22,fontWeight:500,marginBottom:"0.5rem"}},"Implementation tracker"),
    h("div",{style:{fontSize:13,color:"var(--color-text-secondary,#888)",marginBottom:"2rem"}},"How are you accessing this tracker?"),
    h("div",{style:{display:"flex",flexDirection:"column",gap:10}},
      h("button",{onClick:onAdmin,style:{padding:"12px",fontSize:14,fontWeight:500,textAlign:"left",display:"flex",alignItems:"center",gap:10}},
        h("i",{className:"ti ti-lock","aria-hidden":"true",style:{fontSize:18,color:"#185FA5"}}),
        h("div",null,
          h("div",{style:{fontWeight:500}},"Admin — IT engineer"),
          h("div",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",fontWeight:400}},"Edit statuses, deadlines and notes")
        )
      ),
      h("button",{onClick:onViewer,style:{padding:"12px",fontSize:14,fontWeight:500,textAlign:"left",display:"flex",alignItems:"center",gap:10}},
        h("i",{className:"ti ti-eye","aria-hidden":"true",style:{fontSize:18,color:"#3B6D11"}}),
        h("div",null,
          h("div",{style:{fontWeight:500}},"Viewer — Manager"),
          h("div",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",fontWeight:400}},"View all progress, read-only")
        )
      )
    )
  );
}

function PinScreen({value,onChange,error,onSubmit,onBack}){
  return h("div",{style:{padding:"2.5rem 1.5rem",maxWidth:320,margin:"0 auto",textAlign:"center"}},
    h("i",{className:"ti ti-lock","aria-hidden":"true",style:{fontSize:32,color:"#185FA5",marginBottom:"1rem",display:"block"}}),
    h("div",{style:{fontSize:16,fontWeight:500,marginBottom:"0.5rem"}},"Admin PIN"),
    h("div",{style:{fontSize:12,color:"var(--color-text-secondary,#888)",marginBottom:"1.5rem"}},"Enter your PIN to access admin controls"),
    h("input",{type:"password",value,onChange:e=>onChange(e.target.value),onKeyDown:e=>e.key==="Enter"&&onSubmit(),placeholder:"Enter PIN",autoFocus:true,style:{fontSize:18,textAlign:"center",letterSpacing:6,padding:"10px",width:"100%",marginBottom:8,border:error?"1.5px solid #E24B4A":"0.5px solid var(--color-border-secondary,#ccc)",borderRadius:"var(--border-radius-md,8px)"}}),
    error&&h("div",{style:{fontSize:11,color:"#A32D2D",marginBottom:8}},"Incorrect PIN — try again"),
    h("button",{onClick:onSubmit,style:{width:"100%",padding:"8px",fontWeight:500,fontSize:13,marginBottom:8,background:"#E6F1FB",color:"#185FA5",border:"0.5px solid #85B7EB",borderRadius:"var(--border-radius-md,8px)"}},"Unlock"),
    h("button",{onClick:onBack,style:{width:"100%",padding:"6px",fontSize:12,color:"var(--color-text-secondary,#888)"}},"Back")
  );
}

function EditModal({task,onChange,onSave,onClose}){
  return h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:"1rem"}},
    h("div",{style:{background:"var(--color-background-primary,#fff)",borderRadius:"var(--border-radius-lg,12px)",border:"0.5px solid var(--color-border-secondary,#ccc)",padding:"1.5rem",width:"100%",maxWidth:420}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}},
        h("span",{style:{fontWeight:500,fontSize:14}},"Edit task"),
        h("button",{onClick:onClose,style:{padding:"3px 6px",fontSize:14},"aria-label":"Close"},h("i",{className:"ti ti-x","aria-hidden":"true"}))
      ),
      h("div",{style:{fontSize:12,color:"var(--color-text-secondary,#888)",marginBottom:"1rem",lineHeight:1.5}},task.title),
      h("div",{style:{marginBottom:"0.75rem"}},
        h("label",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",display:"block",marginBottom:4}},"Status"),
        h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
          Object.entries(SC).map(([k,v])=>
            h("button",{key:k,onClick:()=>onChange({status:k}),style:{fontSize:11,padding:"4px 10px",borderRadius:20,fontWeight:task.status===k?500:400,background:task.status===k?v.bg:"var(--color-background-secondary,#f5f5f5)",color:task.status===k?v.color:"var(--color-text-secondary,#888)",border:task.status===k?`1.5px solid ${v.border}`:"0.5px solid var(--color-border-tertiary,#eee)"}},v.label)
          )
        )
      ),
      h("div",{style:{marginBottom:"0.75rem"}},
        h("label",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",display:"block",marginBottom:4}},"Priority"),
        h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
          Object.entries(PC).map(([k,v])=>
            h("button",{key:k,onClick:()=>onChange({priority:k}),style:{fontSize:11,padding:"4px 10px",borderRadius:20,fontWeight:task.priority===k?500:400,background:task.priority===k?v.bg:"var(--color-background-secondary,#f5f5f5)",color:task.priority===k?v.color:"var(--color-text-secondary,#888)",border:task.priority===k?`1.5px solid ${v.color}`:"0.5px solid var(--color-border-tertiary,#eee)"}},v.label)
          )
        )
      ),
      h("div",{style:{marginBottom:"0.75rem"}},
        h("label",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",display:"block",marginBottom:4}},"Deadline"),
        h("input",{type:"date",value:task.deadline||"",onChange:e=>onChange({deadline:e.target.value}),style:{fontSize:12,padding:"6px 10px",width:"100%",borderRadius:"var(--border-radius-md,8px)"}})
      ),
      h("div",{style:{marginBottom:"1rem"}},
        h("label",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",display:"block",marginBottom:4}},"Note"),
        h("input",{type:"text",value:task.note||"",onChange:e=>onChange({note:e.target.value}),placeholder:"Add a short note…",style:{fontSize:12,padding:"6px 10px",width:"100%",borderRadius:"var(--border-radius-md,8px)"}})
      ),
      h("button",{onClick:onSave,style:{width:"100%",padding:"8px",fontWeight:500,fontSize:13,background:"#E6F1FB",color:"#185FA5",border:"0.5px solid #85B7EB",borderRadius:"var(--border-radius-md,8px)"}},"Save changes")
    )
  );
}

function TaskRow({task,isAdmin,onCycle,onEdit}){
  const s=SC[task.status];
  const p=PC[task.priority];
  const od=isOD(task.deadline,task.status);
  const icon=task.status==="done"?"ti-circle-check":task.status==="inprogress"?"ti-loader-2":task.status==="blocked"?"ti-circle-x":"ti-circle";
  const rowBg=task.status==="done"?"#FAFDF7":task.status==="inprogress"?"#F5F9FF":task.status==="blocked"?"#FFF8F8":"var(--color-background-primary,#fff)";
  return h("div",{style:{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 14px",borderBottom:"0.5px solid var(--color-border-tertiary,#eee)",background:rowBg,transition:"background 0.2s"}},
    h("div",{style:{paddingTop:2,flexShrink:0}},h("i",{className:`ti ${icon}`,"aria-hidden":"true",style:{fontSize:17,color:s.color}})),
    h("div",{style:{flex:1,minWidth:0}},
      h("div",{style:{fontSize:13,fontWeight:task.status==="done"?400:500,color:task.status==="done"?"var(--color-text-secondary,#888)":"var(--color-text-primary,#1C1C2E)",textDecoration:task.status==="done"?"line-through":"none",marginBottom:2}},task.title),
      h("div",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",lineHeight:1.5}},task.desc),
      h("div",{style:{display:"flex",alignItems:"center",gap:6,marginTop:5,flexWrap:"wrap"}},
        h("span",{style:{fontSize:10,padding:"2px 7px",borderRadius:10,fontWeight:500,background:p.bg,color:p.color}},p.label),
        h("span",{onClick:isAdmin?onCycle:undefined,title:isAdmin?"Click to cycle status":"",style:{fontSize:10,padding:"2px 7px",borderRadius:10,fontWeight:500,cursor:isAdmin?"pointer":"default",background:s.bg,color:s.color,border:`0.5px solid ${s.border}`,userSelect:"none"}},s.label),
        h("span",{style:{fontSize:10,color:od?"#A32D2D":"var(--color-text-secondary,#888)",fontWeight:od?500:400}},
          h("i",{className:"ti ti-calendar","aria-hidden":"true",style:{fontSize:11,verticalAlign:-1,marginRight:3}}),
          fmtDate(task.deadline),od?" · Overdue":""
        ),
        task.note&&h("span",{style:{fontSize:10,color:"var(--color-text-secondary,#888)",fontStyle:"italic"}},"· "+task.note)
      )
    ),
    isAdmin&&h("button",{onClick:onEdit,style:{flexShrink:0,padding:"3px 6px",fontSize:12,background:"none",border:"none",color:"var(--color-text-secondary,#888)"},"aria-label":"Edit"},h("i",{className:"ti ti-edit","aria-hidden":"true",style:{fontSize:15}}))
  );
}

function App(){
  const [tasks,setTasks]=useState(DEFAULT_TASKS);
  const [loaded,setLoaded]=useState(false);
  const [role,setRole]=useState(null);
  const [pinInput,setPinInput]=useState("");
  const [pinError,setPinError]=useState(false);
  const [filterPhase,setFilterPhase]=useState(0);
  const [filterStatus,setFilterStatus]=useState("all");
  const [editingTask,setEditingTask]=useState(null);
  const [saving,setSaving]=useState(false);
  const [expanded,setExpanded]=useState({1:true,2:true,3:true,4:true,5:true,6:true});

  const fetchTasks=useCallback(async()=>{
    try{
      const res=await fetch(API_URL);
      if(!res.ok) throw new Error("Network response error");
      const data=await res.json();
      if(data && data.length > 0){
        const formatted=data.map(t=>({...t,phase:parseInt(t.phase)}));
        setTasks(formatted);
      }
    }catch(e){
      console.warn("Using fallback static tasks due to connection/CORS issue:", e.message);
      // في حال وجود مشكلة في الإتصال، يعتمد على البيانات الثابتة ولا يعطل الشاشة
    }
    setLoaded(true);
  },[]);

  useEffect(()=>{
    fetchTasks();
    const interval=setInterval(fetchTasks,15000); // تحديث كل 15 ثانية
    return ()=>clearInterval(interval);
  },[fetchTasks]);

  const persist=useCallback(async(updated)=>{
    setSaving(true);
    try{
      await fetch(API_URL,{
        method:"POST",
        mode:"no-cors",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(updated)
      });
      setTimeout(fetchTasks,1000);
    }catch(e){
      console.error(e);
    }
    setSaving(false);
  },[fetchTasks]);

  function updateTask(id,changes){
    const updated=tasks.map(t=>t.id===id?{...t,...changes}:t);
    setTasks(updated);persist(updated);
  }

  function cycleStatus(task){
    if(role!=="admin")return;
    const cycle=["todo","inprogress","done","blocked"];
    updateTask(task.id,{status:cycle[(cycle.indexOf(task.status)+1)%cycle.length]});
  }

  function handleLogin(){
    if(pinInput===ADMIN_PIN){setRole("admin");setPinError(false);}
    else{setPinError(true);}
  }

  if(!loaded)return h("div",{style:{padding:"2rem",textAlign:"center",color:"var(--color-text-secondary,#888)",fontSize:14}},"Loading Tracker Data…");
  if(!role)return h(RoleSelect,{onAdmin:()=>setRole("admin-pin"),onViewer:()=>setRole("viewer")});
  if(role==="admin-pin")return h(PinScreen,{value:pinInput,onChange:setPinInput,error:pinError,onSubmit:handleLogin,onBack:()=>{setRole(null);setPinInput("");setPinError(false);}});

  const phases=[...new Set(tasks.map(t=>t.phase))].sort();
  const phaseLabels={};tasks.forEach(t=>{phaseLabels[t.phase]=t.phaseLabel;});
  const filtered=tasks.filter(t=>{
    if(filterPhase&&t.phase!==filterPhase)return false;
    if(filterStatus!=="all"&&t.status!==filterStatus)return false;
    return true;
  });
  const grouped={};filtered.forEach(t=>{if(!grouped[t.phase])grouped[t.phase]=[];grouped[t.phase].push(t);});
  const total=tasks.length,done=tasks.filter(t=>t.status==="done").length,inprog=tasks.filter(t=>t.status==="inprogress").length,blk=tasks.filter(t=>t.status==="blocked").length,od=tasks.filter(t=>isOD(t.deadline,t.status)).length;
  const pct=total>0?Math.round((done/total)*100):0;

  return h("div",{style:{padding:"1.5rem 1rem",maxWidth:760,margin:"0 auto"}},
    h("h2",{className:"sr-only"},"FortiGate implementation task tracker"),
    h("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:"1.25rem",gap:12,flexWrap:"wrap"}},
      h("div",null,
        h("div",{style:{fontSize:12,color:"var(--color-text-secondary,#888)",marginBottom:2,letterSpacing:.5,textTransform:"uppercase",fontWeight:500}},"FortiGate Policy"),
        h("div",{style:{fontSize:22,fontWeight:500,color:"var(--color-text-primary,#1C1C2E)",lineHeight:1.2}},"Implementation tracker")
      ),
      h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        saving&&h("span",{style:{fontSize:11,color:"var(--color-text-secondary,#888)"}},"Saving to Cloud…"),
        h("span",{style:{fontSize:11,padding:"3px 10px",borderRadius:20,fontWeight:500,background:role==="admin"?"#EAF3DE":"#E6F1FB",color:role==="admin"?"#3B6D11":"#185FA5",border:`0.5px solid ${role==="admin"?"#97C459":"#85B7EB"}`}},role==="admin"?"Admin":"Viewer"),
        h("button",{onClick:()=>{setRole(null);setPinInput("");},style:{fontSize:12,padding:"3px 10px"}},"Switch role")
      )
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:"1.25rem"}},
      [{label:"Total",val:total,col:"var(--color-text-primary,#1C1C2E)"},{label:"Done",val:done,col:"#3B6D11"},{label:"In progress",val:inprog,col:"#185FA5"},{label:"Blocked",val:blk,col:"#A32D2D"},{label:"Overdue",val:od,col:od>0?"#A32D2D":"var(--color-text-secondary,#888)"}].map(m=>
        h("div",{key:m.label,style:{background:"var(--color-background-secondary,#f5f5f5)",borderRadius:"var(--border-radius-md,8px)",padding:"10px 12px"}},
          h("div",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",marginBottom:4}},m.label),
          h("div",{style:{fontSize:22,fontWeight:500,color:m.col}},m.val)
        )
      )
    ),
    h("div",{style:{background:"var(--color-background-secondary,#f5f5f5)",borderRadius:"var(--border-radius-md,8px)",padding:"10px 14px",marginBottom:"1.25rem"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:6}},
        h("span",{style:{fontSize:12,color:"var(--color-text-secondary,#888)"}},"Overall progress"),
        h("span",{style:{fontSize:12,fontWeight:500,color:"#3B6D11"}},pct+"% complete")
      ),
      h("div",{style:{height:6,background:"var(--color-border-tertiary,#eee)",borderRadius:3,overflow:"hidden"}},
        h("div",{style:{height:"100%",width:`${pct}%`,background:"#639922",borderRadius:3,transition:"width 0.4s"}})
      )
    ),
    h("div",{style:{display:"flex",gap:8,marginBottom:"1.25rem",flexWrap:"wrap"}},
      h("select",{value:filterPhase,onChange:e=>setFilterPhase(+e.target.value),style:{fontSize:12,padding:"5px 10px"}},
        h("option",{value:0},"All phases"),
        phases.map(p=>h("option",{key:p,value:p},"Phase "+p))
      ),
      h("select",{value:filterStatus,onChange:e=>setFilterStatus(e.target.value),style:{fontSize:12,padding:"5px 10px"}},
        h("option",{value:"all"},"All statuses"),
        Object.entries(SC).map(([k,v])=>h("option",{key:k,value:k},v.label))
      ),
      h("span",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",alignSelf:"center"}},filtered.length+" task"+(filtered.length!==1?"s":"")+" shown")
    ),
    Object.keys(grouped).sort().map(ph=>{
      const phN=+ph,pT=grouped[phN];
      const pD=pT.filter(t=>t.status==="done").length;
      const pPct=pT.length>0?Math.round((pD/pT.length)*100):0;
      const pCol=PCOLS[(phN-1)%PCOLS.length];
      const isExp=expanded[phN]!==false;
      return h("div",{key:phN,style:{marginBottom:"1rem",border:"0.5px solid var(--color-border-tertiary,#eee)",borderRadius:"var(--border-radius-lg,12px)",overflow:"hidden"}},
        h("div",{onClick:()=>setExpanded(e=>({...e,[phN]:!isExp})),style:{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",cursor:"pointer",background:"var(--color-background-secondary,#f5f5f5)",borderBottom:isExp?"0.5px solid var(--color-border-tertiary,#eee)":"none"}},
          h("div",{style:{width:10,height:10,borderRadius:"50%",background:pCol,flexShrink:0}}),
          h("span",{style:{fontWeight:500,fontSize:13,flex:1,color:"var(--color-text-primary,#1C1C2E)"}},phaseLabels[phN]),
          h("span",{style:{fontSize:11,color:"var(--color-text-secondary,#888)"}},pD+"/"+pT.length),
          h("div",{style:{width:60,height:4,background:"var(--color-border-tertiary,#eee)",borderRadius:2,overflow:"hidden"}},
            h("div",{style:{height:"100%",width:`${pPct}%`,background:pCol,borderRadius:2}})
          ),
          h("i",{className:`ti ti-chevron-${isExp?"up":"down"}`,"aria-hidden":"true",style:{fontSize:14,color:"var(--color-text-secondary,#888)"}})
        ),
        isExp&&h("div",null,pT.map(task=>h(TaskRow,{key:task.id,task,isAdmin:role==="admin",onCycle:()=>cycleStatus(task),onEdit:()=>setEditingTask({...task})})))
      );
    }),
    h("div",{style:{marginTop:"1.5rem",padding:"12px 14px",background:"var(--color-background-secondary,#f5f5f5)",borderRadius:"var(--border-radius-lg,12px)",border:"0.5px solid var(--color-border-tertiary,#eee)"}},
      h("div",{style:{fontSize:12,fontWeight:500,marginBottom:8}},"Status legend"),
      h("div",{style:{display:"flex",gap:12,flexWrap:"wrap"}},
        Object.entries(SC).map(([k,v])=>
          h("div",{key:k,style:{display:"flex",alignItems:"center",gap:6}},
            h("div",{style:{width:10,height:10,borderRadius:2,background:v.bg,border:`1px solid ${v.border}`}}),
            h("span",{style:{fontSize:11,color:"var(--color-text-secondary,#888)"}},v.label)
          )
        ),
        role==="admin"&&h("span",{style:{fontSize:11,color:"var(--color-text-secondary,#888)",marginLeft:4}},"· Click status badge to cycle · Click pencil icon to edit")
      )
    ),
    editingTask&&role==="admin"&&h(EditModal,{task:editingTask,onChange:changes=>setEditingTask(t=>({...t,...changes})),onSave:()=>{updateTask(editingTask.id,editingTask);setEditingTask(null);},onClose:()=>setEditingTask(null)})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
